<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5e6d0"/>
      <stop offset="0.5" stop-color="#c9a97a"/>
      <stop offset="1" stop-color="#a8885a"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf3"/>
      <stop offset="1" stop-color="#f0e4d2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Фон -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Название Foodie сверху -->
  <text
    x="256"
    y="150"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="88"
    font-weight="700"
    letter-spacing="2"
    fill="#3a2a18"
    opacity="0.92"
  >Foodie</text>

  <!-- Четырёхугольная звезда (спаркл) -->
  <path
    d="M 256 200
       C 266 250, 286 290, 336 300
       C 286 310, 266 350, 256 400
       C 246 350, 226 310, 176 300
       C 226 290, 246 250, 256 200 Z"
    fill="url(#star)"
    stroke="#8a6a3a"
    stroke-width="4"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Маленькая звезда-акцент -->
  <path
    d="M 380 380
       C 384 396, 392 404, 408 408
       C 392 412, 384 420, 380 436
       C 376 420, 368 412, 352 408
       C 368 404, 376 396, 380 380 Z"
    fill="#fffaf3"
    opacity="0.85"
  />
  <path
    d="M 130 380
       C 134 396, 142 404, 158 408
       C 142 412, 134 420, 130 436
       C 126 420, 118 412, 102 408
       C 118 404, 126 396, 130 380 Z"
    fill="#fffaf3"
    opacity="0.7"
  />
</svg>